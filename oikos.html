<!DOCTYPE html>

<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NUVESTA - Portföy Yönetimi</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;padding-top:125px;padding-bottom:60px}

    header{position:fixed;top:0;left:0;right:0;height:125px;background:#0D5EAF;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .header-left{display:flex;align-items:center;gap:16px}
    .header-left img{width:80px;height:80px;object-fit:contain}
    .header-brand{font-size:28px;font-weight:700;color:#FFD700}

    .filters{position:fixed;top:125px;left:0;right:0;display:flex;gap:15px;padding:12px 24px;background:#fff;border-bottom:1px solid #ddd}
    .fg{display:flex;flex-direction:column;gap:4px}
    .fg label{font-size:10px;color:#666;font-weight:700}
    .fg select{padding:8px;border-radius:6px;border:1px solid #ccc}

    .golden-btn{padding:8px 16px;border-radius:6px;border:2px solid #D4A017;background:#fff;color:#7a5200;font-weight:700;cursor:pointer}
    .golden-btn.active{background:#D4A017;color:#fff;}

    #map-container { height: calc(100vh - 185px); margin-top:60px; }
    #map { width:100%; height:100%; }

    .stats-overlay { position:absolute; top:20px; right:20px; background:rgba(13,94,175,0.9); color:white; padding:15px; border-radius:10px; }
    .stats-count { font-size:22px; font-weight:800; color:#FFD700; }

    footer{position:fixed;bottom:0;left:0;right:0;height:60px;background:#0D5EAF;color:#fff;display:flex;align-items:center;padding:0 24px;font-size:12px}
  </style>

</head>

<body>

<header>
  <div class="header-left">
    <img src="./images/wing.png">
    <div class="header-brand">NUVESTA</div>
  </div>
</header>

<div class="filters">
  <div class="fg">
    <label>Teslim</label>
    <select id="f-durum" onchange="applyFilter()">
      <option value="">Hepsi</option>
      <option value="2026">2026</option>
      <option value="2027">2027</option>
    </select>
  </div>

  <div class="fg">
    <label>Kira</label>
    <select id="f-kira" onchange="applyFilter()">
      <option value="">Hepsi</option>
      <option value="YES">Var</option>
      <option value="NO">Yok</option>
    </select>
  </div>

<button class="golden-btn" id="golden-btn" onclick="toggleGolden()">250K</button>

</div>

<div id="map-container">
  <div id="map"></div>
  <div class="stats-overlay">
    <div class="stats-count" id="h-count">Yükleniyor...</div>
    <small id="h-sub">Veri çekiliyor</small>
  </div>
</div>

<footer>© 2026 NUVESTA</footer>

<script>
let projects = [];
let markers = [];
let goldenActive = false;

const map = L.map('map').setView([37.97, 23.73], 11);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

function loadData(){
  Papa.parse("https://nuvesta.net/nuvesta_db.csv", {
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:function(res){
      projects = res.data;
      createMarkers();
    }
  });
}

function createMarkers(){
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  projects.forEach(p => {
    if(!p.lat || !p.lng || !p.title) return;

    const isG = (p.goldenVisa === "TRUE" || p.goldenVisa === true);

    const m = L.marker([parseFloat(p.lat), parseFloat(p.lng)])
      .bindPopup(`
        <b>${p.title}</b><br>
        ${p.priceRange || ''}<br>
        <img src="./${p.photo || 'images/placeholder.jpg'}" width="100%" onerror="this.src='./images/placeholder.jpg'">
      `);

    m._data = p;
    m._isG = isG;

    markers.push(m);
    m.addTo(map);
  });

  applyFilter();
}

function applyFilter(){
  const d = document.getElementById('f-durum').value;
  const r = document.getElementById('f-kira').value;

  let count = 0;

  markers.forEach(m => {
    const p = m._data;

    const hasRental = p.rental && p.rental !== "NO";
    const gMatch = !goldenActive || m._isG;
    const rMatch = !r || (r === "YES" ? hasRental : !hasRental);
    const dMatch = !d || (p.delivery && p.delivery.includes(d));

    if(gMatch && rMatch && dMatch){
      m.addTo(map);
      count++;
    } else {
      map.removeLayer(m);
    }
  });

  document.getElementById('h-count').textContent = count + " proje";
  document.getElementById('h-sub').textContent = "Hazır";
}

function toggleGolden(){
  goldenActive = !goldenActive;
  document.getElementById('golden-btn').classList.toggle('active');
  applyFilter();
}

loadData();
</script>

</body>
</html>
